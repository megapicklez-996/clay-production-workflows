name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Agent Skills specification
        run: npx --yes skills-ref validate .
      - name: Verify skills CLI discovery
        run: npx --yes skills add . --list
